<footer id="footer">
  <div class="footer-inner">

    <div class="legal-logo">
      <a routerLink="/" fragment="above-the-fold" aria-label="Back to top">
        <img src="assets/img/logo.png" alt="Altin Torba Logo" />
      </a>

      <a
        routerLink="/imprint"
        class="legal-link legal-desktop"
        routerLinkActive="active"
      >
        {{ 'imprint.title' | translate }}
      </a>

      <a
        routerLink="/privacy"
        class="legal-link legal-desktop"
        routerLinkActive="active"
      >
        {{ 'privacy.title' | translate }}
      </a>
    </div>

    <div class="copyright">
      <p>© Altin Torba 2026</p>
    </div>

    <div class="socials">
      <a
        href="https://github.com/AltinTorba"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub profile"
      >
        <img src="assets/img/github.png" alt="GitHub" />
      </a>

      <a href="mailto:altin@altintorba.de" aria-label="Contact via email">
        <img src="assets/img/mail.png" alt="Mail" />
      </a>

      <a href="https://www.linkedin.com/in/altin-torba-987534116/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn profile"
      >
        <img src="assets/img/linkedin.png" alt="LinkedIn" />
      </a>
    </div>

    <a
      routerLink="/imprint"
      class="legal-link legal-mobile"
      routerLinkActive="active"
    >
      {{ 'imprint.title' | translate }}
    </a>

    <a
      routerLink="/privacy"
      class="legal-link legal-mobile"
      routerLinkActive="active"
    >
      {{ 'privacy.title' | translate }}
    </a>

  </div>
</footer>
