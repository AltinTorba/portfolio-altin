<div class="atf-outer-wrapper">
  <section id="above-the-fold">
    <img class="left" src="./assets/img/shadow-atf-purple.png" alt="">
    <img class="right" src="./assets/img/shadow-atf-blue.png" alt="">

    <div class="atf-header">
      <span>{{ 'atf.intro' | translate }}</span>

      <div class="atf-headline">
        <h1>Altin Torba</h1>
        <h2>Fullstack {{ 'atf.headline' | translate }}</h2>
      </div>
    </div>

    <a routerLink="/" fragment="contact">
      <button class="regular-btn">
        {{ 'atf.button' | translate }}
      </button>
    </a>

    <div class="socials">
      <div class="line"></div>
      <div class="icons">
        <a href="https://github.com/AltinTorba" target="_blank">
          <img src="./assets/img/github.png" alt="GitHub" />
        </a>
        <a routerLink="/" fragment="contact">
          <img src="./assets/img/mail.png" [attr.alt]="'atf.contactAlt' | translate" />
        </a>
                <a href="https://www.linkedin.com/in/altin-torba-987534116/" target="_blank">
          <img src="./assets/img/linkedin.png" alt="LinkedIn" />
        </a>
      </div>
    </div>

    <p id="scroll-btn" data-aos="fade-up">
      {{ 'atf.vertical' | translate }} &#8594;
    </p>
  </section>
</div>
