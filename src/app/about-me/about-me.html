<section id="about-me">
  <div class="about-content-wrapper">
    <div class="info-container">
      <h1 data-aos="fade-right">
        {{ 'about.headline' | translate }}
      </h1>

      <div class="info-content">
        <span data-aos="fade-right">
          {{ 'about.introductionText' | translate }}
        </span>

        <table data-aos="fade-right">
          <tr>
            <td><img src="./assets/img/location.png" alt="" /></td>
            <td class="va-middle">{{ 'about.locationText' | translate }}</td>
          </tr>
          <tr>
            <td><img src="./assets/img/bulb.png" alt="" /></td>
            <td class="va-middle">{{ 'about.learningText' | translate }}</td>
          </tr>
          <tr>
            <td><img src="./assets/img/puzzle.png" alt="" /></td>
            <td class="va-middle">{{ 'about.solvingText' | translate }}</td>
          </tr>
        </table>
      </div>
    </div>

    <div class="photo-container" #photoContainer>
      <img src="./assets/img/photo.png" [attr.alt]="'about.profilePhotoAlt' | translate" />
      <img src="./assets/img/shadows_photo.png" alt="" />
    </div>
  </div>
</section>
